# Local / single-server deployment. For production in India, run this on a VM
# in an Indian region (e.g. AWS ap-south-1 Mumbai, GCP asia-south1, Azure
# Central India) or swap `db` for a managed Postgres in the same region.
#
#   cp .env.example .env   # set ENCRYPTION_KEY, APP_URL, passwords, LLM keys
#   docker compose up -d --build
#   docker compose --profile ollama up -d   # optional self-hosted LLM

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., target: build }
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://sehat:${APP_DB_PASSWORD}@db:5432/sehat
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://sehat:${APP_DB_PASSWORD}@db:5432/sehat
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  uploads:
  ollama:
